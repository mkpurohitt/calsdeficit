# Cloud Build config: builds the Next.js image with the NEXT_PUBLIC_* values
# baked in (as Docker build args) and pushes it to Artifact Registry — all
# server-side inside Google's network, so it avoids the flaky local
# `docker push` from Cloud Shell. Invoked by scripts/deploy/cloud-run.sh.
#
# Substitutions are supplied by the deploy script from your .env.local.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        docker build -t "$_IMAGE" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$_FB_API_KEY" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$_FB_AUTH_DOMAIN" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$_FB_PROJECT_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$_FB_STORAGE_BUCKET" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$_FB_SENDER_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$_FB_APP_ID" \
          --build-arg NEXT_PUBLIC_APP_URL="$_APP_URL" \
          --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="$_GA_ID" \
          --build-arg NEXT_PUBLIC_ADSENSE_CLIENT_ID="$_ADSENSE_CLIENT" \
          --build-arg NEXT_PUBLIC_ADSENSE_SLOT_NATIVE="$_ADSENSE_SLOT" \
          --build-arg NEXT_PUBLIC_AMAZON_AFFILIATE_TAG="$_AMAZON_TAG" \
          .
images:
  - '$_IMAGE'
options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'
timeout: 1800s
